<head>

<title>Rebold NewBusiness</title>
<meta name="description" content="Plataforma del equipo comercial de Rebold: de las notas de la reunión a la propuesta en Google Slides, con revisión de directores y dashboard de propuestas.">

<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<style>
:root{
  --bg:#08080A;--panel:#111114;--panel2:#18181C;--line:#26262C;--text:#F2F2F4;--muted:#9A9AA2;
  --mag:#CD2B53;--mag2:#E0456C;--ok:#22C55E;--warn:#E0A526;--err:#EF4444;--r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Archivo,Arial,sans-serif}
a{color:#FF7C9C;text-decoration:none}a:hover{text-decoration:underline}
h1,h2,h3,h4{font-family:"Archivo Black","Arial Black",sans-serif;font-weight:400;margin:0 0 .4em;letter-spacing:-.01em}
h1{font-size:26px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}h3{font-size:15px;text-transform:uppercase;letter-spacing:.06em}h4{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:18px}
.muted{color:var(--muted)}.sm{font-size:13px}.nowrap{white-space:nowrap}.r{text-align:right}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:24px;padding:12px 24px;background:#08080A;border-bottom:1px solid var(--line)}
header.top img{height:18px;display:block}
.nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}.nav a{color:var(--muted);padding:6px 12px;border-radius:8px;font-weight:600}.nav a:hover{color:var(--text);text-decoration:none;background:var(--panel2)}.nav a.on{color:var(--text);background:var(--panel2)}
#user{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
main#view{max-width:1480px;margin:0 auto;padding:24px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font:600 14px Archivo,sans-serif;cursor:pointer;text-decoration:none!important;white-space:nowrap}
.btn:hover{border-color:#44444c}.btn:disabled{opacity:.55;cursor:wait}
.btn.primary{background:var(--mag);border-color:var(--mag)}.btn.primary:hover{background:var(--mag2)}
.btn.ghost{background:transparent}.btn.sm{padding:4px 10px;font-size:12.5px}.btn.big{padding:12px 22px;font-size:15px}
.btn.rec{background:var(--err);border-color:var(--err);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.7}}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;border-top:3px solid var(--mag)}
.kpi span{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.kpi b{display:block;font:400 26px "Archivo Black",sans-serif;margin:4px 0;font-variant-numeric:tabular-nums}.kpi small{color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.bar{display:grid;grid-template-columns:150px 1fr 170px;gap:10px;align-items:center;margin:7px 0;font-size:13px}
.bar .bl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bar .bv{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.bt{height:10px;background:var(--panel2);border-radius:5px;overflow:hidden}.bt i{display:block;height:100%;background:var(--mag);border-radius:5px;min-width:2px}
.filters{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;align-items:center}.filters input{flex:1;min-width:220px}
input,select,textarea{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font:14px Archivo,sans-serif}
input:focus,select:focus,textarea:focus{outline:2px solid var(--mag);outline-offset:-1px;border-color:transparent}
textarea{resize:vertical}
label{display:block;font-size:13px;font-weight:600;color:#C9C9CF}label>input,label>select,label>textarea{margin-top:5px}
.chk{display:flex;align-items:center;gap:6px;white-space:nowrap}.chk input{width:auto}
.form h3{margin-top:10px;padding-top:6px}.form h3:not(:first-child){margin-top:26px;border-top:1px solid var(--line);padding-top:20px}
.row{display:flex;gap:12px;margin-bottom:12px;align-items:flex-end;flex-wrap:wrap}.row>label{flex:1;min-width:140px}.row>.f2{flex:2}.row>.f3{flex:3}
.rm,.rm-sp{width:34px;flex:0 0 34px;justify-content:center}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{cursor:pointer}.chip input{display:none}
.chip span{display:inline-block;padding:7px 14px;border:1px solid var(--line);border-radius:20px;background:var(--panel2);font-weight:600}
.chip input:checked+span{background:var(--mag);border-color:var(--mag)}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;margin:14px 0}.drop.over{border-color:var(--mag);background:rgba(205,43,83,.08)}.drop p{margin:4px 0}
.recbox{display:flex;gap:12px;align-items:center;flex-wrap:wrap}#liveTx{flex:1;font-style:italic}
.files{list-style:none;padding:0;margin:12px 0}.files li{display:flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;background:var(--panel2)}.files li.bad{border-color:var(--err)}.files li button{margin-left:auto}
.ft{font-size:11px;text-transform:uppercase;font-weight:700;background:#2a2a30;padding:2px 7px;border-radius:5px;color:#FF7C9C}
.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.actions.col{flex-direction:column}.actions.col .btn{justify-content:center}
.tablewrap{overflow-x:auto}.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}.tbl tr:hover td{background:rgba(255,255,255,.02)}
.tbl select.estado{width:auto;padding:4px 8px;font-size:12.5px;font-weight:700;border-left:4px solid var(--c)}
.tbl .acts{flex-wrap:nowrap;justify-content:flex-end}
.badge{font:700 12px Archivo,sans-serif;padding:3px 10px;border-radius:12px;background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--text);border:1px solid var(--c);letter-spacing:0;text-transform:none;vertical-align:middle}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:6px;background:rgba(205,43,83,.18);color:#FFB3C6;margin:2px 2px 2px 0}
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--mag);border-radius:50%;animation:sp 0.8s linear infinite;display:inline-block}.spin.sm{width:14px;height:14px;border-width:2px;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.prog ol{padding-left:22px}.prog li{margin:6px 0;color:var(--muted)}.prog li.done{color:var(--ok)}.prog li.done::marker{content:'✓  '}.prog li.now{color:var(--text);font-weight:700}.prog.err{border-color:var(--err)}
.note{padding:10px 14px;border-radius:8px;margin-bottom:12px;font-size:14px;border:1px solid}.note.ok{border-color:#1f5f38;background:rgba(34,197,94,.08)}.note.warn{border-color:#6b5217;background:rgba(224,165,38,.08)}
/* editor */
.editor{display:grid;grid-template-columns:190px minmax(0,1fr) 330px;gap:16px;align-items:start}
.thumbs{max-height:calc(100vh - 150px);overflow-y:auto;position:sticky;top:70px;padding-right:4px}
.thumb{cursor:pointer;margin-bottom:10px;border:2px solid transparent;border-radius:6px;padding:2px}.thumb.on{border-color:var(--mag)}.thumb.fixed{opacity:.55;cursor:default}
.thumb{width:182px}.thumb .tw{position:relative;width:174px;height:98px;overflow:hidden;border-radius:3px}
.thumb .sc{position:absolute;left:0;top:0;width:1333.3px;height:750px;transform:scale(.1305);transform-origin:0 0}
.thumb>span{display:block;font-size:11px;color:var(--muted);padding:3px 2px}
.stage{min-width:0}.stagebar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.frame{position:relative;width:100%;overflow:hidden;border-radius:6px;background:#000;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.frame .sc{width:1333.3px;height:750px;transform-origin:0 0;position:absolute;left:0;top:0}
.slide{position:relative;width:1333.3px;height:750px;overflow:hidden}
.slide .st{display:flex;flex-direction:column;white-space:pre-wrap;overflow:visible;word-wrap:break-word}
.slide img{display:block}
.slide .editable{cursor:text;border-radius:3px}.slide .editable:hover{outline:2px dashed rgba(205,43,83,.7);outline-offset:4px}.slide .editable.editing{outline:2px solid #CD2B53;outline-offset:4px;background:rgba(0,0,0,.35)}
.aibox{display:grid;grid-template-columns:1fr auto;gap:10px 12px;align-items:end;margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.aibox #bSave{grid-column:1/-1;justify-self:end}
.side .card{padding:14px}.side p{margin:.5em 0}.side ul,.side ol{padding-left:18px;margin:.4em 0}
.insight{font-family:"Archivo Black",sans-serif;font-size:15px;line-height:1.3;color:#FFB3C6}
.hist{list-style:none;padding:0!important}.hist li{border-left:2px solid var(--mag);padding:2px 0 6px 10px;margin-bottom:6px;font-size:13px}
.review{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.slidesList .frame{margin-bottom:14px}.review .side{position:sticky;top:70px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}.modal .card{width:min(900px,100%)}
#toasts{position:fixed;right:16px;bottom:16px;z-index:60;display:flex;flex-direction:column;gap:8px;max-width:min(440px,calc(100vw - 32px))}
.toast{background:#1d1d22;border:1px solid var(--line);border-left:4px solid var(--ok);padding:10px 14px;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.4);font-size:14px}.toast.err{border-left-color:var(--err)}
details summary{cursor:pointer;font-weight:700;margin:14px 0 8px}
@media (max-width:1180px){.editor{grid-template-columns:1fr}.thumbs{position:static;max-height:none;display:flex;gap:8px;overflow-x:auto}.thumb{flex:0 0 182px}.review{grid-template-columns:1fr}.review .side{position:static}}
@media (max-width:760px){main#view{padding:16px}.grid2{grid-template-columns:1fr}.bar{grid-template-columns:100px 1fr 110px}header.top{gap:10px;padding:10px 16px;flex-wrap:wrap}.aibox{grid-template-columns:1fr}.aibox #bSave{justify-self:stretch}h1{font-size:21px}}
</style>
</head>

    case 'tabla':
      s.columnas = arr(s.columnas, 2, 4, () => '').map(str);
      s.filas = arr(s.filas, 1, 6, () => []).map(f => { f = Array.isArray(f) ? f.map(str) : []; while (f.length < s.columnas.length) f.push(''); return f.slice(0, s.columnas.length); });
      break;
    case 'inversion': s.items = arr(s.items, 1, 4, item); break;
    case 'cierre': s.items = arr(s.items, 3, 3, item); break;
  }
  return s;
}

        P.push(T(it.titulo, { x: ix, y: y0 + 1.1, w: iw, h: 0.72, font: FB, size: 15, min: 10.5, lh: 0.95, upper: 1, bind: `items.${i}.titulo` }));
        P.push(T(it.texto, { x: ix, y: y0 + 1.9, w: iw, h: ch - 2.15, size: 12, min: 8.5, color: C.g1, bind: `items.${i}.texto` }));
      });
      footer();
      return { bg, prims: P };
    }
  }
  return { bg, prims: P };
}

// Slides completas del deck: portada de marca + slides de contenido + contraportada.
function deckPages(deck, prop) {
  const pages = [{ slide: { tipo: 'marca' }, fixed: true }];
  (deck.slides || []).forEach((s, i) => pages.push({ slide: s, index: i }));
  pages.push({ slide: { tipo: 'marca' }, fixed: true });
  return pages.map((p, n) => Object.assign(p, layoutSlide(p.slide.tipo === 'marca' ? p.slide : normSlide(p.slide),
    { marca: prop.marca, n, bgAlt: n % 2 === 0, prop })));
}

function fmtMoney(v, m) {
  const n = Number(v || 0);
  return '$' + n.toLocaleString('es-CO', { maximumFractionDigits: 0 }) + (m && m !== 'COP' ? ' ' + m : '');
}

// ── Render HTML ──
const PX = 100, PT = 100 / 72;
function renderPage(page, opts = {}) {
  const el = document.createElement('div');
  el.className = 'slide';
  el.style.background = '#' + page.bg;
  for (const p of page.prims) {
    let d;
    if (p.k === 'rect' || p.k === 'ellipse') {
      d = document.createElement('div');
      d.style.background = '#' + p.fill;
      if (p.k === 'ellipse') d.style.borderRadius = '50%';
    } else if (p.k === 'img') {
      d = document.createElement('img');
      d.src = ASSETS[p.src];
      d.style.objectFit = 'cover';
      if (p.transparency) d.style.opacity = String(1 - p.transparency / 100);
    } else if (p.k === 'icon') {
      d = document.createElement('div');
      d.innerHTML = iconSvg(p.name, p.color, p.w * PX);
    } else if (p.k === 'text') {
      d = document.createElement('div');
      d.className = 'st';
      d.textContent = p.text;
      Object.assign(d.style, {
        fontFamily: p.font === FB ? '"Arial Black","Archivo Black",Arial,sans-serif' : 'Arial,Helvetica,sans-serif',
        fontWeight: p.font === FB ? '900' : '400',
        fontSize: p.size * PT + 'px', color: '#' + p.color, textAlign: p.align,
        justifyContent: p.valign === 'middle' ? 'center' : p.valign === 'bottom' ? 'flex-end' : 'flex-start',
        lineHeight: String(1.2 * p.lh), letterSpacing: (p.spacing || 0) * PT + 'px',
        fontStyle: p.italic ? 'italic' : 'normal'
      });
      if (p.rotate) d.style.transform = `rotate(${p.rotate - 360}deg)`;
      if (opts.editable && p.bind) {
        d.contentEditable = 'true';
        d.spellcheck = true;
        d.dataset.bind = p.bind;
        d.classList.add('editable');
      }
    }
    Object.assign(d.style, { position: 'absolute', left: p.x * PX + 'px', top: p.y * PX + 'px', width: p.w * PX + 'px', height: p.h * PX + 'px' });
    el.appendChild(d);
  }
  return el;
}

// ── Exportación .pptx (PptxGenJS) ──
const _iconCache = {};
async function iconPng(name, color) {
  const key = name + color;
  if (_iconCache[key]) return _iconCache[key];
  const img = new Image();
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(iconSvg(name, color, 160));
  await img.decode();
  const cv = document.createElement('canvas'); cv.width = cv.height = 160;
  cv.getContext('2d').drawImage(img, 0, 0, 160, 160);
  return (_iconCache[key] = cv.toDataURL('image/png'));
}

async function buildPptx(deck, prop) {
  const pptx = new PptxGenJS();
  pptx.layout = 'LAYOUT_WIDE';
  pptx.author = 'Rebold'; pptx.company = 'Rebold by ISPD';
  pptx.title = `${prop.marca} · Propuesta Rebold`;
  for (const page of deckPages(deck, prop)) {
    const sl = pptx.addSlide();
    sl.background = { color: page.bg };
    for (const p of page.prims) {
      if (p.k === 'rect' || p.k === 'ellipse') {
        sl.addShape(p.k === 'rect' ? pptx.ShapeType.rect : pptx.ShapeType.ellipse,
          { x: p.x, y: p.y, w: p.w, h: p.h, fill: { color: p.fill }, line: { color: p.fill, width: 0 } });
      } else if (p.k === 'img') {
        sl.addImage({ data: ASSETS[p.src], x: p.x, y: p.y, w: p.w, h: p.h, transparency: p.transparency || 0 });
      } else if (p.k === 'icon') {
        sl.addImage({ data: await iconPng(p.name, p.color), x: p.x, y: p.y, w: p.w, h: p.h });
      } else if (p.k === 'text' && p.text) {
        sl.addText(p.text, {
          x: p.x, y: p.y, w: p.w, h: p.h, fontFace: p.font, fontSize: p.size, color: p.color,
          italic: !!p.italic, align: p.align, valign: p.valign, charSpacing: p.spacing || 0,
          lineSpacingMultiple: p.lh, margin: 0, rotate: p.rotate || 0, fit: 'none', paraSpaceAfter: 0
        });
      }
    }
  }
  return pptx;
}

async function claudeDirect({ system, messages, max_tokens, effort }) {
  if (!cfg.apiKey) throw new Error('Sin backend configurado: agrega una API key de Claude en Configuración (modo local) o configura el backend.');
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'content-type': 'application/json', 'x-api-key': cfg.apiKey, 'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: cfg.model || 'claude-opus-5', max_tokens: max_tokens || 8000,
      system: [{ type: 'text', text: system, cache_control: { type: 'ephemeral' } }],
      messages, output_config: { effort: effort || 'medium' }
    })
  });
  const j = await res.json();
  if (!res.ok) throw new Error('Claude API: ' + ((j.error && j.error.message) || res.status));
  if (j.stop_reason === 'refusal') throw new Error('El modelo declinó la solicitud.');
  return j.content.filter(b => b.type === 'text').map(b => b.text).join('');
}

function parseJSON(text) {
  let t = String(text || '').trim().replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '');
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a < 0 || b < 0) throw new Error('La IA no devolvió JSON');
  return JSON.parse(t.slice(a, b + 1));
}

async function askJSON(userContent, { max_tokens = 8000, effort = 'medium' } = {}) {
  const system = KB + REGLAS + SLIDE_SCHEMAS;
  const messages = [{ role: 'user', content: userContent }];
  let r = await api('llm', { system, messages, max_tokens, effort });
  try { return parseJSON(r.text); } catch (e) {
    messages.push({ role: 'assistant', content: r.text || '(vacío)' });
    messages.push({ role: 'user', content: 'Tu respuesta no era JSON válido. Devuelve SOLO el JSON completo y válido, sin texto adicional.' });
    r = await api('llm', { system, messages, max_tokens, effort: 'low' });
    return parseJSON(r.text);
  }
}

// Paso 2: redacción de las slides en dos bloques en paralelo (más rápido y dentro de los límites del backend).
async function genSlides(prop, est, onProgress) {
  const outline = (est.outline || []).slice(0, 14);
  const mitad = Math.ceil(outline.length / 2);
  const partes = [outline.slice(0, mitad), outline.slice(mitad)].filter(p => p.length);
  let listos = 0;
  const outs = await Promise.all(partes.map((parte, pi) => {
    const offset = pi === 0 ? 0 : mitad;
    const lista = parte.map((o, i) => `${offset + i + 1}. [${o.tipo}] ${o.proposito}`).join('\n');
    return askJSON([{
      type: 'text', text: `${contextoEstrategia(prop, est)}

OUTLINE COMPLETO (para contexto):
${outline.map((o, i) => `${i + 1}. [${o.tipo}] ${o.proposito}`).join('\n')}

TAREA: redacta SOLO estas slides, en este orden, respetando el tipo y los límites de caracteres:
${lista}

Devuelve SOLO: {"slides":[ ...${parte.length} objetos slide... ]}`
    }], { max_tokens: 7000, effort: 'low' }).then(r => { listos++; onProgress && onProgress(listos, partes.length); return r; });
  }));
  const slides = [];
  outs.forEach((o, pi) => {
    const esperados = partes[pi];
    esperados.forEach((ol, i) => {
      const s = (o.slides || [])[i] || { tipo: ol.tipo, kicker: '', titulo: ol.proposito };
      slides.push(normSlide(Object.assign({}, s, { tipo: s.tipo || ol.tipo })));
    });
  });
  return slides;
}

async function ajusteGlobal(prop, est, slides, instruccion) {

PRESENTACIÓN ACTUAL (índice desde 0):

AJUSTE SOLICITADO A TODA LA PRESENTACIÓN: ${instruccion}

Devuelve SOLO: {"cambios":[{"indice":n,"slide":{...}}], "insertar":[{"despues_de":n,"slide":{...}}], "eliminar":[n]} — incluye solo lo que cambia.`
  }], { max_tokens: 8000, effort: 'low' });
  const cambios = {};
  (r.cambios || []).forEach(c => { if (slides[c.indice]) cambios[c.indice] = normSlide(c.slide); });
  const del = new Set(r.eliminar || []);
  const out = [];
  const insertar = i => (r.insertar || []).filter(x => (x.despues_de ?? slides.length - 1) === i).forEach(x => out.push(normSlide(x.slide)));
  insertar(-1);
  slides.forEach((s, i) => { if (!del.has(i)) out.push(cambios[i] || s); insertar(i); });
  return out.length ? out : slides;
}

// Salvaguarda: detecta cifras de dinero en el texto generado que no vienen del material ni de la base de conocimiento.
function cifrasSospechosas(slides, fuente) {
  const permitido = (KB + ' ' + (fuente || '')).replace(/\s/g, '');
  const avisos = [];
  slides.forEach((s, i) => {
    const txt = JSON.stringify(s);
    (txt.match(/\$\s?[\d.,]+(\s?(mil|millones|M|K)\b)?|\b\d[\d.,]*\s?(millones|COP|USD|MXN)\b/gi) || []).forEach(m => {
      m = m.replace(/[.,]+$/, '');
      if (!permitido.includes(m.replace(/\s/g, ''))) avisos.push({ slide: i + 2, cifra: m });
    });
  });
  return avisos;
}

const readAs = (file, how) => new Promise((ok, ko) => {
  const r = new FileReader();
  r.onload = () => ok(r.result); r.onerror = () => ko(r.error);
  how === 'text' ? r.readAsText(file) : how === 'buffer' ? r.readAsArrayBuffer(file) : r.readAsDataURL(file);
});
const b64of = dataUrl => String(dataUrl).split(',')[1] || '';

async function prepararArchivo(file) {
  const name = file.name, mime = file.type || '', ext = name.split('.').pop().toLowerCase();
  const a = { name, mime, size: file.size, kind: 'otro', file };
  try {
    if (/^text\//.test(mime) || ['txt', 'md', 'csv', 'json', 'vtt', 'srt'].includes(ext)) { a.kind = 'texto'; a.text = await readAs(file, 'text'); }
    else if (ext === 'pdf' || mime === 'application/pdf') {
      if (file.size > 20e6) throw new Error('PDF mayor a 20 MB');
      a.kind = 'pdf'; a.b64 = b64of(await readAs(file, 'url'));
    }
    else if (ext === 'docx') { a.kind = 'texto'; a.text = (await mammoth.extractRawText({ arrayBuffer: await readAs(file, 'buffer') })).value; }
    else if (ext === 'pptx') {
      const zip = await JSZip.loadAsync(await readAs(file, 'buffer'));
      const slides = Object.keys(zip.files).filter(f => /^ppt\/slides\/slide\d+\.xml$/.test(f)).sort((x, y) => parseInt(x.match(/\d+/)) - parseInt(y.match(/\d+/)));
      const out = [];
      for (const f of slides) { const xml = await zip.file(f).async('string'); out.push((xml.match(/<a:t>([^<]*)<\/a:t>/g) || []).map(t => t.slice(5, -6)).join(' ')); }
      a.kind = 'texto'; a.text = out.map((t, i) => `[Slide ${i + 1}] ${t}`).join('\n');
    }
    else if (['xlsx', 'xls'].includes(ext)) {
      const wb = XLSX.read(await readAs(file, 'buffer'), { type: 'array' });
      a.kind = 'texto'; a.text = wb.SheetNames.map(n => `[Hoja ${n}]\n` + XLSX.utils.sheet_to_csv(wb.Sheets[n])).join('\n').slice(0, 60000);
    }
    else if (/^image\//.test(mime)) { a.kind = 'imagen'; a.b64 = await imagenReducida(file); a.mime = 'image/jpeg'; }
    else if (/^audio\//.test(mime) || /^video\/webm/.test(mime) || ['mp3', 'm4a', 'wav', 'ogg', 'webm', 'mp4', 'aac', 'flac'].includes(ext)) {
      if (file.size > 24e6) throw new Error('Audio mayor a 24 MB: divide el archivo o usa la grabación en vivo');
      a.kind = 'audio';
    }
    else throw new Error('Formato no soportado');
  } catch (e) { a.error = e.message; }
  return a;
}

async function imagenReducida(file) {
  const img = new Image();
  img.src = URL.createObjectURL(file);
  await img.decode();
  const k = Math.min(1, 1568 / Math.max(img.width, img.height));
  const cv = document.createElement('canvas'); cv.width = img.width * k; cv.height = img.height * k;
  cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
  URL.revokeObjectURL(img.src);
  return b64of(cv.toDataURL('image/jpeg', 0.85));
}

async function armarMaterial(form, onStep) {
  const bloques = [], textos = [];
  if (form.notas.trim()) textos.push('## Notas del comercial\n' + form.notas.trim());
  for (const a of form.archivos) {
    if (a.error) continue;
    if (a.kind === 'texto') textos.push(`## Archivo: ${a.name}\n${a.text}`);
    if (a.kind === 'pdf') bloques.push({ type: 'document', source: { type: 'base64', media_type: 'application/pdf', data: a.b64 }, title: a.name });
    if (a.kind === 'imagen') bloques.push({ type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: a.b64 } });
    if (a.kind === 'audio') {
      if (a.transcripcion == null) {
        onStep && onStep('Transcribiendo ' + a.name);
        try {
          const r = await api('transcribe', { name: a.name, mime: a.mime, data: b64of(await readAs(a.file, 'url')) });
          a.transcripcion = r.text;
        } catch (e) { a.transcripcion = ''; toast(`${a.name}: ${e.message}`, 'err'); }
      }
      if (a.transcripcion) textos.push(`## Transcripción de audio: ${a.name}\n${a.transcripcion}`);
    }
  }
  return { bloques, texto: textos.join('\n\n') };
}

  catch (e) { toast('No hay acceso al micrófono: ' + e.message, 'err'); return; }
  const chunks = [], mr = new MediaRecorder(stream);

      live.textContent = (texto + interim).slice(-600);
    };
    sr.onend = () => { if (rec) try { sr.start(); } catch (e) {} };
    sr.start();
  } else live.textContent = 'Tu navegador no transcribe en vivo (usa Chrome o Edge). El audio se guardará igual.';
  mr.ondataavailable = e => chunks.push(e.data);
  mr.onstop = () => {
    stream.getTracks().forEach(t => t.stop());
    const r = rec; rec = null;
    if (sr) sr.stop();
    btn.classList.remove('rec'); btn.innerHTML = '● Grabar reunión';
    const blob = new Blob(chunks, { type: mr.mimeType || 'audio/webm' });
    const file = new File([blob], `grabacion_${new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-')}.webm`, { type: blob.type });
    onDone({ name: file.name, mime: file.type, size: file.size, kind: 'audio', file, transcripcion: texto.trim() || null });
    live.textContent = '';
  };
  mr.start(1000);
  rec = { stop: () => mr.stop() };
  btn.classList.add('rec'); btn.innerHTML = '■ Detener grabación';
}

async function generar() {
  const F = FORM;
  const prop = { marca: F.marca, presupuesto: F.presupuesto, moneda: F.moneda, periodicidad: F.periodicidad, tipoCliente: F.tipoCliente, comercial: F.comercial, comercialEmail: F.comercialEmail, clientes: F.clientes.filter(c => c.nombre), directores: F.directores };
  const pasos = ['Leyendo el material de la reunión', 'Diagnóstico y estrategia (Growth Suite + Strategic Planning 360)', 'Redactando las slides', 'Maquetando la presentación', 'Guardando borrador'];
  const box = $('#progress');
  $('#gen').disabled = true;
  const paint = (i, extra) => {
    box.innerHTML = `<div class="card prog"><h3>Generando la propuesta de ${esc(prop.marca)}…</h3><ol>${pasos.map((p, j) => `<li class="${j < i ? 'done' : j === i ? 'now' : ''}">${esc(p)}${j === i && extra ? ` <span class="muted sm">${esc(extra)}</span>` : ''}</li>`).join('')}</ol><p class="muted sm">Puede tomar 1–2 minutos.</p></div>`;
    box.scrollIntoView({ behavior: 'smooth', block: 'center' });
  };
  try {
    paint(0);
    const material = await armarMaterial(F, s => paint(0, s));
    paint(1);
    const est = await genEstrategia(prop, material);
    paint(2, '0/2');
    const slides = await genSlides(prop, est, (n, t) => paint(2, `${n}/${t}`));
    paint(3);
    const fuenteTexto = material.texto + '\n' + (est.hechos_clave || []).join('\n');
    const deck = { estrategia: est, slides, fuente: { texto: fuenteTexto.slice(0, 80000), archivos: F.archivos.map(a => a.name) }, generado: new Date().toISOString() };
    paint(4);
    const r = await api('save', { propuesta: Object.assign({ resumen: resumenDe(est) }, prop), deck, detalle: `Generada con IA: ${slides.length} slides · ${(est.diagnostico && est.diagnostico.servicios || []).map(s => s.servicio).join(' + ')}` });
    const archivos = F.archivos;
    S.current = { prop: r.propuesta, deck, dirty: false };
    S.sel = 0;
    FORM = nuevaForm();
    location.hash = '#/p/' + r.propuesta.id;
    if (online()) respaldarArchivos(r.propuesta.id, archivos);
  } catch (e) {
    console.error(e);
    box.innerHTML = `<div class="card prog err"><h3>No se pudo generar</h3><p>${esc(e.message)}</p></div>`;
    $('#gen').disabled = false;
  }
}

async function respaldarArchivos(id, archivos) {
  for (const a of archivos) {
    if (!a.file || a.size > 25e6) continue;
    try { await api('uploadFile', { id, name: a.name, mime: a.mime || a.file.type, data: b64of(await readAs(a.file, 'url')) }); } catch (e) { console.warn('respaldo', a.name, e); }
  }
}

function resumenDe(est) {
  const d = est.diagnostico || {};
  return { servicios: (d.servicios || []).map(s => s.servicio), industria: d.industria || '', objetivo: d.objetivo || '', insight: (est.narrativa || {}).insight || '' };
}

async function cargarPropuesta(id) {
  if (S.current && S.current.prop.id === id && S.current.deck) return S.current;
  const r = await api('get', { id });
  if (!r.propuesta) throw new Error('Propuesta no encontrada');
  S.current = { prop: r.propuesta, deck: r.deck || { estrategia: {}, slides: [] }, dirty: false };
  S.sel = 0;
  return S.current;
}

        ${(d.servicios || []).map(s => `<p class="sm"><b>${esc(s.servicio)}</b> (${esc(s.rol || '')}): ${esc(s.porque || '')}</p>`).join('')}
        ${d.modelo_trabajo ? `<p class="sm"><b>Modelo:</b> ${esc(d.modelo_trabajo)}</p>` : ''}

        ${(d.dolores || []).length ? `<p class="sm"><b>Dolores detectados:</b></p><ul class="sm">${d.dolores.map(x => `<li>${esc(x.dolor)}${x.evidencia ? ` <span class="muted">“${esc(x.evidencia)}”</span>` : ''}</li>`).join('')}</ul>` : ''}

  const slides = deck.slides;
  const pages = () => deckPages(deck, prop);
  const drawThumbs = () => {
    const ps = pages();
    const th = $('#thumbs'); th.innerHTML = '';
    ps.forEach((pg, n) => {
      const w = document.createElement('div');
      w.className = 'thumb' + (pg.index === S.sel ? ' on' : '') + (pg.fixed ? ' fixed' : '');
      const tw = document.createElement('div'); tw.className = 'tw';
      const sc = document.createElement('div'); sc.className = 'sc';
      sc.appendChild(renderPage(pg)); tw.appendChild(sc); w.appendChild(tw);
      const lbl = document.createElement('span'); lbl.textContent = String(n + 1).padStart(2, '0') + (pg.fixed ? ' · marca' : ' · ' + pg.slide.tipo);
      w.appendChild(lbl);
      if (!pg.fixed) w.onclick = () => { S.sel = pg.index; drawThumbs(); drawStage(); };
      th.appendChild(w);
    });
  };
  const drawStage = () => {
    if (!slides.length) { $('#frame').innerHTML = '<div class="empty"><p>Sin slides.</p></div>'; return; }
    S.sel = Math.max(0, Math.min(S.sel, slides.length - 1));
    const pg = pages()[S.sel + 1];
    const fr = $('#frame'); fr.innerHTML = '';
    const sc = document.createElement('div'); sc.className = 'sc';
    sc.appendChild(renderPage(pg, { editable: true }));
    fr.appendChild(sc);
    fitFrame();
    $('#selInfo').textContent = `Slide ${S.sel + 2} de ${slides.length + 2} · ${slides[S.sel].tipo}`;
    $$('.editable', fr).forEach(el => {
      el.onfocus = () => el.classList.add('editing');
      el.onblur = () => {
        el.classList.remove('editing');
        let v = el.innerText.replace(/ /g, ' ').trim();
        const b = el.dataset.bind;
        if (b === 'titulo' || b === 'frase') v = v.replace(/\s*\n\s*/g, ' / ');
        if (b === 'cita.fuente') v = v.replace(/^—\s*/, '');
        const cur = getPath(slides[S.sel], b);
        if (String(cur || '').toUpperCase() === v.toUpperCase().replace(/\s*\n\s*/g, ' / ') || cur === v) return;
        setPath(slides[S.sel], b, v);
        S.current.dirty = true;
        drawStage(); drawThumbs();
      };
    });
  };
  drawThumbs(); drawStage();
  window.onresize = fitFrame;

  const mover = dlt => { const i = S.sel, j = i + dlt; if (j < 0 || j >= slides.length) return; [slides[i], slides[j]] = [slides[j], slides[i]]; S.sel = j; S.current.dirty = true; drawThumbs(); drawStage(); };
  $('#sUp').onclick = () => mover(-1);
  $('#sDown').onclick = () => mover(1);
  $('#sDup').onclick = () => { slides.splice(S.sel + 1, 0, JSON.parse(JSON.stringify(slides[S.sel]))); S.sel++; S.current.dirty = true; drawThumbs(); drawStage(); };
  $('#sDel').onclick = () => { if (slides.length > 1 && confirm('¿Eliminar esta slide?')) { slides.splice(S.sel, 1); S.current.dirty = true; drawThumbs(); drawStage(); } };

  const busy = async (btn, fn) => {
    const t = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<span class="spin sm"></span> ' + t;
    try { await fn(); } catch (e) { console.error(e); toast(e.message, 'err'); } finally { btn.disabled = false; btn.innerHTML = t; }
  };
  $('#bAiSlide').onclick = e => busy(e.currentTarget, async () => {
    const ins = $('#aiSlide').value.trim(); if (!ins) return toast('Escribe qué quieres ajustar', 'err');
    slides[S.sel] = await ajustarSlide(prop, est, slides[S.sel], ins);
    S.current.dirty = true; $('#aiSlide').value = ''; drawThumbs(); drawStage(); toast('Slide ajustada');
  });
  $('#bAiAll').onclick = e => busy(e.currentTarget, async () => {
    const ins = $('#aiAll').value.trim(); if (!ins) return toast('Escribe el ajuste', 'err');
    const nuevo = await ajusteGlobal(prop, est, slides, ins);
    slides.splice(0, slides.length, ...nuevo);
    S.current.dirty = true; $('#aiAll').value = ''; drawThumbs(); drawStage(); toast('Presentación ajustada');
  });
  const guardar = async (detalle) => {
    const r = await api('save', { propuesta: prop, deck, detalle: detalle || 'Edición de slides' });
    Object.assign(prop, r.propuesta); S.current.dirty = false;
  };
  $('#bSave').onclick = e => busy(e.currentTarget, async () => { await guardar(); toast('Cambios guardados'); });
  $('#bPptx').onclick = e => busy(e.currentTarget, async () => {
    const pptx = await buildPptx(deck, prop);
    await pptx.writeFile({ fileName: `${prop.marca} - Propuesta Rebold v${prop.version || 0}.pptx` });
    logEvent('descargar_pptx', prop.id, `${slides.length + 2} slides`);
  });
  const subirDrive = async () => {
    if (!online()) throw new Error('Guardar en Drive requiere el backend. Configúralo en Configuración; mientras tanto usa "Descargar .pptx".');
    await guardar('Guardado previo a Drive');
    const pptx = await buildPptx(deck, prop);
    const b64 = await pptx.write({ outputType: 'base64' });
    const r = await api('uploadDeck', { id: prop.id, data: b64 });
    Object.assign(prop, r.propuesta);
  };
  $('#bDrive').onclick = e => busy(e.currentTarget, async () => { await subirDrive(); toast('Guardada en Google Drive como Google Slides'); viewEditor(prop.id); });
  $('#bRev').onclick = e => busy(e.currentTarget, async () => {
    const com = prompt('Mensaje para los directores (opcional):', prop.estado === 'Ajustes solicitados' ? 'Ajustes aplicados.' : '');
    if (com === null) return;
    if (online()) await subirDrive(); else await guardar('Envío a revisión');
    const r = await api('submitReview', { id: prop.id, comentario: com });
    Object.assign(prop, r.propuesta);
    toast('Enviada a revisión · Slack: ' + r.slack);
    viewEditor(prop.id);
  });
  $('#estadoSel').onchange = async e => {
    try { const r = await api('status', { id: prop.id, estado: e.target.value }); Object.assign(prop, r.propuesta); toast('Estado: ' + prop.estado); viewEditor(prop.id); }
    catch (err) { toast(err.message, 'err'); }
  };
  $('#copyRev').onclick = () => { navigator.clipboard.writeText(location.href.split('#')[0] + '#/review/' + prop.id); toast('Link copiado'); };
  $('#bDatos').onclick = () => modalDatos(prop, () => { S.current.dirty = true; viewEditor(prop.id); });
}

function fitFrame() {
  const fr = $('#frame'); if (!fr) return;
  const sc = $('.sc', fr); if (!sc) return;
  const k = fr.clientWidth / 1333.3;
  sc.style.transform = `scale(${k})`;
  fr.style.height = 750 * k + 'px';
}
function getPath(o, p) { return p.split('.').reduce((a, k) => (a == null ? a : a[k]), o); }
function setPath(o, p, v) { const ks = p.split('.'); const last = ks.pop(); const t = ks.reduce((a, k) => (a[k] = a[k] || (isNaN(k) ? {} : [])), o); t[last] = v; }

function historial(p) {
  const rs = (p.revisiones || []).slice().reverse();
  if (!rs.length) return '<p class="muted sm">Sin revisiones todavía.</p>';
  const lbl = { envio: 'Enviada a revisión', aprobar: 'Aprobó', ajustes: 'Pidió ajustes', validar: 'Validó' };
  return `<ul class="hist">${rs.map(r => `<li><b>${esc(lbl[r.tipo] || r.tipo)}</b> · ${esc(r.por)} · v${esc(r.version)} <span class="muted sm">${fecha(r.fecha)}</span>${r.comentario ? `<div class="sm">${esc(r.comentario)}</div>` : ''}</li>`).join('')}</ul>`;
}

      directores: fd.getAll('dir').length ? fd.getAll('dir') : prop.directores

  };

  $('#ping').onclick = async () => {
    read(); $('#pingOut').textContent = 'Probando…';
    try { serverInfo = await api('ping'); $('#pingOut').textContent = online() ? `Conectado ✓ · backend v${serverInfo.version} · modelo ${serverInfo.model} · Slack ${serverInfo.slack ? 'sí' : 'no'} · transcripción ${serverInfo.transcripcion ? 'sí' : 'no'}` : 'Sin URL: modo local'; }
    catch (e) { $('#pingOut').textContent = '✕ ' + e.message; }
  };
  form.onsubmit = async e => {
    e.preventDefault(); read(); saveCfg();
    if (online()) { try { serverInfo = await api('ping'); } catch (err) { toast(err.message, 'err'); } }
    drawUser(); toast('Configuración guardada');
    if (primera) route();
  };
}

function drawUser() {
  $('#user').innerHTML = cfg.nombre ? `<span class="dot" style="background:${online() ? '#22C55E' : '#E0A526'}" title="${online() ? 'Conectado al backend' : 'Modo local'}"></span>${esc(cfg.nombre)}` : '';
}

window.addEventListener('hashchange', () => {
  if (S.current && S.current.dirty && !confirm('Hay cambios sin guardar en la presentación. ¿Salir de todos modos?')) return;
  if (S.current && S.current.dirty) S.current = null;
  route();
});
